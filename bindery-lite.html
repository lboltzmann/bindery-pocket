<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bindery — Pocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1208;--paper:#f5f0e8;--cream:#ede8da;--aged:#d4c9b0;--rust:#c0452a;--gold:#b8860b;--gold-light:#d4a843;--forest:#2d4a3e;--sienna:#8b4513}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:2rem}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

header{position:sticky;top:0;z-index:50;background:var(--ink);color:var(--paper);padding:1rem 1.1rem .9rem}
.hd-top{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem}
.logo{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;font-style:italic;color:var(--gold-light);line-height:1}
.logo-sub{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--aged);margin-top:.15rem}
.sync-btn{background:none;border:1.5px solid var(--aged);color:var(--aged);border-radius:2px;padding:.4rem .7rem;font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.05em;cursor:pointer;white-space:nowrap;flex-shrink:0}
.sync-btn:active{background:rgba(212,201,176,.15)}
.sync-line{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--aged);margin-top:.6rem;letter-spacing:.03em}
.sync-line strong{color:var(--gold-light);font-weight:500}

.search-wrap{position:sticky;top:64px;z-index:49;background:var(--cream);border-bottom:1px solid var(--aged);padding:.75rem 1.1rem}
.search-wrap input{width:100%;padding:.65rem .85rem;border:1.5px solid var(--aged);border-radius:2px;background:var(--paper);font-family:'DM Sans',sans-serif;font-size:1rem;color:var(--ink)}
.search-wrap input:focus{outline:none;border-color:var(--gold)}
.chips{display:flex;gap:.4rem;margin-top:.6rem;overflow-x:auto;padding-bottom:.1rem}
.chip{flex-shrink:0;padding:.4rem .8rem;border:1.5px solid var(--aged);background:transparent;border-radius:20px;font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);cursor:pointer}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.tabs{display:flex;border-bottom:2px solid var(--aged);background:var(--paper)}
.tab{flex:1;padding:.7rem;text-align:center;border:none;background:transparent;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--aged);border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer}
.tab.active{color:var(--ink);border-bottom-color:var(--ink)}
.tabs.hidden{display:none}

main{padding:.5rem 1.1rem 1rem}
.count-line{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);padding:.9rem 0 .6rem}

.row{display:flex;align-items:center;gap:.7rem;padding:.8rem .2rem;border-bottom:1px solid var(--cream)}
.row-badge{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;border:1.5px solid var(--aged)}
.row-badge.read{background:var(--forest);color:#fff;border-color:var(--forest)}
.row-badge.reading{background:var(--gold);color:#fff;border-color:var(--gold)}
.row-badge.unread{background:transparent;color:var(--aged)}
.row-badge.high{background:var(--gold);color:#fff;border-color:var(--gold)}
.row-badge.medium{background:transparent;color:var(--gold);border-color:var(--gold)}
.row-badge.low{background:transparent;color:var(--aged)}
.row-info{flex:1;min-width:0}
.row-title{font-family:'Playfair Display',serif;font-size:.98rem;font-weight:700;line-height:1.25}
.row-author{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--sienna);margin-top:.15rem}
.row-meta{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--aged);margin-top:.2rem}
.row-meta .series{color:var(--gold)}

.empty{text-align:center;padding:3.5rem 1.5rem}
.empty-icon{font-size:2.8rem;opacity:.3;margin-bottom:.75rem}
.empty h3{font-family:'Playfair Display',serif;font-size:1.25rem;font-style:italic;color:var(--aged);margin-bottom:.4rem}
.empty p{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--aged);line-height:1.6}
.empty .load-btn{margin-top:1.25rem}

.load-btn{display:inline-block;padding:.7rem 1.3rem;background:var(--ink);color:var(--paper);border:none;border-radius:2px;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.load-btn:active{background:var(--sienna)}
#file-input{display:none}

.toast{position:fixed;bottom:1.25rem;left:1.1rem;right:1.1rem;background:var(--ink);color:var(--paper);padding:.75rem 1rem;border-radius:3px;font-family:'DM Mono',monospace;font-size:.72rem;z-index:200;transform:translateY(120%);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);border-left:3px solid var(--gold-light);text-align:center}
.toast.show{transform:translateY(0);opacity:1}
</style>
</head>
<body>

<header>
  <div class="hd-top">
    <div>
      <div class="logo">The Bindery</div>
      <div class="logo-sub">Pocket &middot; Read-Only</div>
    </div>
    <button class="sync-btn" id="refresh-btn" onclick="refreshSync()">&#8635; Refresh</button>
  </div>
  <div class="sync-line" id="sync-line">Loading&hellip;</div>
</header>

<div class="search-wrap">
  <input type="text" id="search-input" placeholder="Search title, author, ISBN, series&hellip;" oninput="onSearch()">
  <div class="chips" id="lib-chips">
    <button class="chip active" data-f="all">All</button>
    <button class="chip" data-f="reading">Reading</button>
    <button class="chip" data-f="unread">Unread</button>
    <button class="chip" data-f="read">Read</button>
  </div>
  <div class="chips" id="wish-chips" style="display:none">
    <button class="chip active" data-f="all">All</button>
    <button class="chip" data-f="high">High</button>
    <button class="chip" data-f="medium">Medium</button>
    <button class="chip" data-f="low">Low</button>
  </div>
</div>

<div class="tabs hidden" id="tabs">
  <button class="tab active" id="tab-lib" onclick="switchTab('lib')">Library</button>
  <button class="tab" id="tab-wish" onclick="switchTab('wish')">Wishlist</button>
</div>

<main>
  <div class="count-line" id="count-line" style="display:none"></div>
  <div id="list"></div>
</main>

<input type="file" id="file-input" accept=".json" onchange="handleFile(event)">
<div class="toast" id="toast"></div>

<script>
'use strict';
let books=[], wishlist=[], exportedAt=null, sourceLabel='';
let curTab='lib', libFilter='all', wishFilter='all', searchQ='';
const DATA_FILENAME='bindery-library.json';

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function bookStatus(b){return b.status||(b.read?'read':'unread');}
function fmtWhen(iso){
  if(!iso) return '';
  try{
    const d=new Date(iso);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }catch{return iso;}
}

// ═══════════════════════════════════════════════
// LOADING DATA — two paths, both land on loadData()
// A) fetch(): works when this file is hosted (e.g. GitHub Pages) alongside
//    a bindery-library.json that gets replaced each time you re-export.
// B) file picker: works anywhere, including opened straight from disk/cloud
//    storage, where fetch() of a sibling local file is usually blocked.
// ═══════════════════════════════════════════════
function loadData(payload,label){
  const incoming=Array.isArray(payload)?{books:payload}:payload;
  if(!incoming||!Array.isArray(incoming.books)){toast('That file doesn\'t look like a Bindery export.');return false;}
  books=incoming.books||[];
  wishlist=Array.isArray(incoming.wishlist)?incoming.wishlist:[];
  exportedAt=incoming.exportedAt||null;
  sourceLabel=label;
  document.getElementById('tabs').classList.toggle('hidden',!wishlist.length);
  if(!wishlist.length&&curTab==='wish') switchTab('lib');
  updateSyncLine();
  render();
  return true;
}

async function tryAutoFetch(silent){
  try{
    const res=await fetch('./'+DATA_FILENAME+'?_='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json=await res.json();
    loadData(json,'auto-synced from '+DATA_FILENAME);
    return true;
  }catch(err){
    if(!silent) toast('Couldn\'t auto-load '+DATA_FILENAME+' — use Load File instead.');
    return false;
  }
}

function refreshSync(){
  if(sourceLabel.startsWith('auto-synced')){
    document.getElementById('sync-line').textContent='Refreshing\u2026';
    tryAutoFetch(false);
  } else {
    document.getElementById('file-input').click();
  }
}

function handleFile(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const json=JSON.parse(ev.target.result);
      if(loadData(json,'loaded from '+file.name)) toast('Loaded '+books.length+' book(s) from '+file.name);
    }catch(err){toast('Could not parse that file as JSON.');}
  };
  reader.readAsText(file);
  e.target.value='';
}

function updateSyncLine(){
  const el=document.getElementById('sync-line');
  const bits=[];
  bits.push(books.length+' book'+(books.length!==1?'s':''));
  if(wishlist.length) bits.push(wishlist.length+' wishlist');
  bits.push(sourceLabel);
  if(exportedAt) bits.push('exported '+fmtWhen(exportedAt));
  el.innerHTML='<strong>'+esc(bits[0]+(bits[1]&&bits[1].endsWith('wishlist')?' &middot; '+bits[1]:''))+'</strong> &middot; '+esc(bits.slice(bits[1]&&bits[1].endsWith('wishlist')?2:1).join(' &middot; '));
}

// ═══════════════════════════════════════════════
// TABS / FILTERS / SEARCH
// ═══════════════════════════════════════════════
function switchTab(t){
  curTab=t;
  document.getElementById('tab-lib').classList.toggle('active',t==='lib');
  document.getElementById('tab-wish').classList.toggle('active',t==='wish');
  document.getElementById('lib-chips').style.display=t==='lib'?'flex':'none';
  document.getElementById('wish-chips').style.display=t==='wish'?'flex':'none';
  render();
}
function onSearch(){searchQ=document.getElementById('search-input').value.trim().toLowerCase();render();}

document.getElementById('lib-chips').addEventListener('click',e=>{
  const b=e.target.closest('[data-f]');if(!b)return;
  document.querySelectorAll('#lib-chips [data-f]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');libFilter=b.dataset.f;render();
});
document.getElementById('wish-chips').addEventListener('click',e=>{
  const b=e.target.closest('[data-f]');if(!b)return;
  document.querySelectorAll('#wish-chips [data-f]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');wishFilter=b.dataset.f;render();
});

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function libRowHtml(b){
  const st=bookStatus(b), icon=st==='read'?'\u2713':st==='reading'?'\u25CB':'\u25CB';
  const metaBits=[];
  if(b.series) metaBits.push(`<span class="series">${esc(b.series)}${b.seriesNum?' #'+esc(String(b.seriesNum)):''}</span>`);
  if(b.year) metaBits.push(esc(String(b.year)));
  if(b.isbn) metaBits.push(esc(b.isbn));
  return `<div class="row">
    <div class="row-badge ${st}">${st==='reading'?'\u{1F4D6}':icon}</div>
    <div class="row-info">
      <div class="row-title">${esc(b.title||'Untitled')}</div>
      <div class="row-author">${esc(b.author||'Unknown author')}</div>
      ${metaBits.length?`<div class="row-meta">${metaBits.join(' &middot; ')}</div>`:''}
    </div>
  </div>`;
}
function wishRowHtml(w){
  const p=w.priority||'medium';
  const metaBits=[];
  if(w.genre) metaBits.push(esc(w.genre));
  if(w.year) metaBits.push(esc(String(w.year)));
  return `<div class="row">
    <div class="row-badge ${p}">\u2605</div>
    <div class="row-info">
      <div class="row-title">${esc(w.title||'Untitled')}</div>
      <div class="row-author">${esc(w.author||'Unknown author')}</div>
      ${metaBits.length?`<div class="row-meta">${metaBits.join(' &middot; ')}</div>`:''}
    </div>
  </div>`;
}

function render(){
  const listEl=document.getElementById('list');
  const countEl=document.getElementById('count-line');
  if(!books.length&&!wishlist.length){
    countEl.style.display='none';
    listEl.innerHTML=`<div class="empty">
      <div class="empty-icon">\u{1F4DA}</div>
      <h3>No library loaded yet</h3>
      <p>Host this page next to <strong>${DATA_FILENAME}</strong> and it'll sync automatically \u2014 or load a fresh export by hand.</p>
      <button class="load-btn" onclick="document.getElementById('file-input').click()">\u{1F4C2} Load Export File</button>
    </div>`;
    return;
  }
  let list, html;
  if(curTab==='lib'){
    list=books.slice();
    if(libFilter!=='all') list=list.filter(b=>bookStatus(b)===libFilter);
    if(searchQ) list=list.filter(b=>(b.title||'').toLowerCase().includes(searchQ)||(b.author||'').toLowerCase().includes(searchQ)||(b.isbn||'').includes(searchQ)||(b.series||'').toLowerCase().includes(searchQ));
    list.sort((a,b)=>(a.title||'').localeCompare(b.title||''));
    countEl.style.display='block';
    countEl.textContent=list.length+' book'+(list.length!==1?'s':'');
    html=list.length?list.map(libRowHtml).join(''):`<div class="empty"><div class="empty-icon">\u{1F50D}</div><h3>No matches</h3><p>Try a different search or filter.</p></div>`;
  } else {
    list=wishlist.slice();
    if(wishFilter!=='all') list=list.filter(w=>(w.priority||'medium')===wishFilter);
    if(searchQ) list=list.filter(w=>(w.title||'').toLowerCase().includes(searchQ)||(w.author||'').toLowerCase().includes(searchQ)||(w.isbn||'').includes(searchQ));
    const order={high:0,medium:1,low:2};
    list.sort((a,b)=>(order[a.priority]??1)-(order[b.priority]??1));
    countEl.style.display='block';
    countEl.textContent=list.length+' wishlist book'+(list.length!==1?'s':'');
    html=list.length?list.map(wishRowHtml).join(''):`<div class="empty"><div class="empty-icon">\u2605</div><h3>No matches</h3><p>Try a different search or filter.</p></div>`;
  }
  listEl.innerHTML=html;
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
(async()=>{
  const ok=await tryAutoFetch(true);
  if(!ok){
    document.getElementById('sync-line').textContent='No auto-sync file found \u2014 tap Refresh to load one by hand.';
    render();
  }
})();
</script>
</body>
</html>
